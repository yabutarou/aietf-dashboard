:root { color-scheme: light dark; --bg:#fff; --fg:#16181d; --muted:#6b7280;

@media (prefers-color-scheme: dark) {

          --up:#3ecf8e; --down:#f2666b; --accent:#7aa2ff; } }
* { box-sizing:border-box; }
body { margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--fg);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
.wrap { max-width:880px; margin:0 auto; }
h1 { font-size:19px; margin:0 0 2px; letter-spacing:.02em; }

     margin:32px 0 10px; font-weight:600; }
.sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
.hero { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
.big { font-size:34px; font-weight:650; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-top:16px; }
.k { color:var(--muted); font-size:12px; }
.v { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
.up { color:var(--up); } .down { color:var(--down); }
.tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px; }
th,td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
th:first-child,td:first-child { text-align:left; }
th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
tr:last-child td { border-bottom:none; }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; min-width:60px; }
.bar > i { display:block; height:100%; background:var(--accent); }
.note { color:var(--muted); font-size:13px; background:var(--card); border:1px solid var(--line);
        border-radius:10px; padding:12px 14px; margin-top:12px; }
.empty { color:var(--muted); padding:20px; text-align:center; }
a { color:var(--accent); }

.alert { border-radius:12px; padding:16px 18px; margin:20px 0; border:1px solid;
         display:flex; gap:12px; align-items:flex-start; }
.alert .icon { font-size:20px; line-height:1.2; }
.alert h3 { margin:0 0 4px; font-size:15px; }
.alert p { margin:0; font-size:13px; color:var(--muted); }
.alert.act { background:color-mix(in srgb, var(--accent) 10%, var(--bg));
             border-color:var(--accent); }
.alert.quiet { background:var(--card); border-color:var(--line); }
.tag { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px;
       border-radius:999px; margin-right:6px; }
.tag.sell { background:color-mix(in srgb, var(--down) 18%, var(--bg)); color:var(--down); }
.tag.buy  { background:color-mix(in srgb, var(--up) 18%, var(--bg)); color:var(--up); }
.chart { border:1px solid var(--line); border-radius:12px; padding:12px 8px 4px; background:var(--card); }
.chart svg { display:block; width:100%; height:auto; }
.chart .gridline { stroke:var(--line); stroke-width:1; }
.chart .zero { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; opacity:.6; }
.chart .series { fill:none; stroke:var(--accent); stroke-width:2;
                 stroke-linejoin:round; stroke-linecap:round; }
.chart .tick { fill:var(--muted); font-size:10px; }
.chart .last { fill:var(--accent); }
.chart .lastlabel { fill:var(--fg); font-size:11px; font-weight:600; }
.disclaimer { color:var(--muted); font-size:12px; margin-top:32px; padding-top:16px;
              border-top:1px solid var(--line); }
.ratio { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
.ratio .bar { flex:1 1 auto; max-width:110px; }
